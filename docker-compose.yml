services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inrliquid
      POSTGRES_USER: inrliquid
      POSTGRES_PASSWORD: inrliquid_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inrliquid -d inrliquid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
